[[{MinViewLevel:0,Template:adminLogin,Page_Title:Login,Page_Description:,Page_Keywords:}]]
<style>
  .ies-tabs { display:flex; border-bottom:2px solid #e8eaf0; margin-bottom:22px; }
  .ies-tab-btn { flex:1; padding:10px 0; background:none; border:none; border-bottom:3px solid transparent;
    margin-bottom:-2px; cursor:pointer; font-size:15px; font-weight:600; color:#8086a9; transition:color .2s,border-color .2s; }
  .ies-tab-btn.active { color:#4154f1; border-bottom-color:#4154f1; }
  .ies-tab-btn:hover { color:#4154f1; }
  .ies-tab-pane { display:none; }
  .ies-tab-pane.active { display:block; }
  .ies-google-center { display:flex; flex-direction:column; align-items:center; padding:8px 0 16px; gap:12px; }
</style>

<div class="ies-tabs">
  <button class="ies-tab-btn" onclick="iesLoginTab('pwd',this)">Sign In</button>
  <button class="ies-tab-btn active" onclick="iesLoginTab('google',this)">Google</button>
</div>

<!-- Tab 1: Username / Password -->
<div class="ies-tab-pane" id="ies-pane-pwd">
  <form action="login" method="post" name="form1">
    <input type="hidden" name="form_id" value="login" />
    <input type="hidden" name="deeplink" id="deeplink" value="" />
    <script>document.getElementById('deeplink').value = new URLSearchParams(window.location.search).get('deeplink') || '';</script>

    <div class="mb-3">
      <label for="loginUser" class="form-label">Username</label>
      <input type="text" class="form-control" id="loginUser" name="username" maxlength="256" autofocus />
    </div>

    <div class="mb-3">
      <label for="loginPass" class="form-label">Password</label>
      <input type="password" class="form-control" id="loginPass" name="password" maxlength="256" />
    </div>

    <div class="mb-3 form-check">
      <input class="form-check-input" type="checkbox" name="RememberMe" value="true" id="rememberMe" checked />
      <label class="form-check-label" for="rememberMe">Remember me</label>
    </div>

    <button type="submit" name="Login" class="btn-login">Log In</button>
  </form>
</div>

<!-- Tab 2: Google Sign-In -->
<div class="ies-tab-pane active" id="ies-pane-google">
  <div class="ies-google-center">
    <div id="g_id_onload"
      data-client_id="[[google_client_id]]"
      data-callback="onGoogleCredential"
      data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="sign_in_with"
      data-shape="rectangular"
      data-logo_alignment="left">
    </div>
    <p style="font-size:13px;color:#8086a9;margin:0">Sign in using your Google account.<br>Your email must be registered in this system.</p>
  </div>

  <!-- Hidden form submitted after Google credential is received -->
  <form id="googleLoginForm" action="login" method="post" style="display:none">
    <input type="hidden" name="google_credential" id="googleCredentialField" />
    <input type="hidden" name="deeplink" id="googleDeeplink" value="" />
  </form>

  <script>
    document.getElementById('googleDeeplink').value = new URLSearchParams(window.location.search).get('deeplink') || '';
    function onGoogleCredential(response) {
      document.getElementById('googleCredentialField').value = response.credential;
      document.getElementById('googleLoginForm').submit();
    }
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</div>

<script>
  function iesLoginTab(name, btn) {
    document.querySelectorAll('.ies-tab-pane').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.ies-tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('ies-pane-' + name).classList.add('active');
    btn.classList.add('active');
  }
</script>
