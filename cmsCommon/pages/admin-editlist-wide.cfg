<!-- ******* admin_editlist_wide.cfg ********************
     Ids below are wired to cmsCommon/src/admin-editlist.js — keep them exact.
     Only the surrounding markup/classes are cosmetic and safe to restyle. -->
<div class="page-header-row">
  <h1 class="tile-title" style="font-size:20px; margin:0;" id="editlist_title"></h1>
  <div style="display:flex; align-items:center; gap:10px;">
    <form id="editlist_searchform" style="display:flex; align-items:center; gap:8px; margin:0;">
      <input type="text" size="24" id="fltSearch" name="search"
        onFocus="SetSearchTimer(true);" onblur="RepeatTimer=false;"
        class="btn-secondary" style="font-weight:400; cursor:text;" placeholder="Search…" value="">
      <label style="font-size:12.5px; color:var(--ink-2); display:flex; align-items:center; gap:4px;">
        <input type="checkbox" id="fltHistory" name="fltHistory" value="true" onClick="SetSearchTimer(false);">
        History
      </label>
    </form>
    <div id="buttons_search1" style="display:inline-flex; gap:8px;">
      <button type="button" id="editlist_add1" class="btn-primary" onClick="OpenItem('*new*');return false;">+ Add</button>
      <button type="button" id="editlist_refresh1" class="btn-secondary" onClick="ShowPanel('loading');SendSearch();return false;">Refresh</button>
    </div>
    <div id="buttons_save1" style="display:none; gap:8px;">
      <button type="submit" class="btn-primary" onClick="SaveItem();return false;">Save/Close</button>
      <button type="submit" class="btn-secondary" onClick="CancelEdit();return false;">Cancel</button>
      <button type="submit" class="btn-secondary" onClick="DeleteItem();return false;">Delete</button>
      <span class="remove_ok" style="display:none;"><button type="submit" class="btn-secondary" onClick="RemoveItem();return false;">Remove</button></span>
    </div>
  </div>
</div>

<div id="editlist_loading" style="padding:24px 0; color:var(--ink-2);">Loading data…</div>
<div id="editlist_search" style="display:none;"></div>
<div id="editlist_form" style="display:none;"></div>

<div class="page-header-row" style="margin-top:16px; margin-bottom:0;">
  <span></span>
  <div style="display:flex; align-items:center; gap:10px;">
    <div id="buttons_search2" style="display:inline-flex; gap:8px;">
      <button type="button" id="editlist_add2" class="btn-primary" onClick="OpenItem('*new*');return false;">+ Add</button>
      <button type="button" id="editlist_refresh2" class="btn-secondary" onClick="ShowPanel('loading');SendSearch();return false;">Refresh</button>
    </div>
    <div id="buttons_save2" style="display:none; gap:8px;">
      <button type="submit" class="btn-primary" onClick="SaveItem();return false;">Save/Close</button>
      <button type="submit" class="btn-secondary" onClick="CancelEdit();return false;">Cancel</button>
      <button type="submit" class="btn-secondary" onClick="DeleteItem();return false;">Delete</button>
      <span class="remove_ok" style="display:none;"><button type="submit" class="btn-secondary" onClick="RemoveItem();return false;">Remove</button></span>
    </div>
  </div>
</div>
<!-- ******* END admin_editlist_wide.cfg ******************** -->
