[[{ MinViewLevel:3,
	MinEditLevel:99,
	ShowAdminMenuLink:false,
	Template:admin_dashboard,
	Page_Title:Administration
}]]
<div class="card card-pad" style="margin-bottom:20px;">
  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
    <div class="section-title" style="margin:0;">Site Configuration</div>
  </div>
  <dl class="config-grid">
    <div class="config-field"><dt>Site ID</dt><dd>[[siteId]]</dd></div>
    <div class="config-field"><dt>Site Title</dt><dd>[[siteParameter:siteTitle]]</dd></div>
    <div class="config-field"><dt>Database</dt><dd>[[databasename]]</dd></div>
    <div class="config-field"><dt>Default Page</dt><dd>[[DefaultPageID]]</dd></div>
    <div class="config-field"><dt>Script Version</dt><dd>[[ScriptVersion]]</dd></div>
  </dl>
</div>

<div class="section-title">Launch</div>
<div class="tile-grid" style="margin-bottom:24px;">
  <a class="tile" href="#" onclick="gotopage('/[[world]]',false);return false;">
    <span class="tile-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
    <span><p class="tile-title">Website Content</p><p class="tile-desc">View &amp; edit the live site</p></span>
  </a>
  <a class="tile" href="admin-edit?eclass=edit-wikipage">
    <span class="tile-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/></svg></span>
    <span><p class="tile-title">Page List</p><p class="tile-desc">Create &amp; edit pages</p></span>
  </a>
  <a class="tile" href="#" onclick="FileBrowse('~none','');return false;">
    <span class="tile-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></span>
    <span><p class="tile-title">Files &amp; Images</p><p class="tile-desc">Manage &amp; upload media</p></span>
  </a>
  <a class="tile" href="#">
    <span class="tile-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg></span>
    <span><p class="tile-title">Photo Galleries</p><p class="tile-desc">Manage gallery images</p></span>
  </a>
  <a class="tile" href="admin-edit?eclass=edit-members">
    <span class="tile-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
    <span><p class="tile-title">Users &amp; Access</p><p class="tile-desc">Manage user accounts</p></span>
  </a>
  <a class="tile" href="adminReports">
    <span class="tile-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
    <span><p class="tile-title">Reports</p><p class="tile-desc">Site activity &amp; stats</p></span>
  </a>
  <a class="tile" href="admin-edit?eclass=MessageLog">
    <span class="tile-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
    <span><p class="tile-title">Message Log</p><p class="tile-desc">Submitted form messages</p></span>
