[[{MinViewLevel:1,Template:myaccount,Page_Title:My Account,Page_Description:,Page_Keywords:}]]
<style>
  .acct-nav { display:flex; gap:10px; margin-bottom:22px; }
  .acct-nav a { flex:1; text-align:center; padding:10px 0; border-radius:6px; font-size:14px;
    font-weight:600; text-decoration:none; color:#4154f1; background:#eef0fd; }
  .acct-nav a:hover { background:#e0e3fb; }
  .acct-info { margin-bottom: 26px; }
  .acct-info-row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid #eef0f4; font-size:14px; }
  .acct-info-row:last-child { border-bottom:none; }
  .acct-info-label { color:#8086a9; font-weight:600; }
  .acct-info-value { color:#2c384e; font-weight:600; text-align:right; }
  .acct-pwd-toggle { cursor:pointer; font-size:15px; font-weight:700; color:#2c384e; padding:8px 0;
    list-style:none; }
  .acct-pwd-toggle::-webkit-details-marker { display:none; }
  .acct-pwd-toggle::before { content:"▸ "; color:#4154f1; }
  details[open] .acct-pwd-toggle::before { content:"▾ "; }
  .acct-pwd-body { padding-top:14px; }
  .acct-pwd-status { margin-top:12px; font-size:14px; font-weight:600; text-align:center;
    padding:10px 14px; border-radius:6px; display:none; }
  .acct-pwd-status.ok { display:block; color:#1e7a34; background:#eef8f0; border:1px solid #c8e6cf; }
  .acct-pwd-status.err { display:block; color:#c02020; background:#fff0f0; border:1px solid #f5c6c6; }
</style>

<div class="acct-nav">
  <a href="javascript:history.back()">&larr; Back</a>
  <a href="/[[DefaultPageID]]">Home</a>
</div>

<div class="acct-info">
  <div class="acct-info-row"><span class="acct-info-label">Name</span><span class="acct-info-value">[[my_username]]</span></div>
  <div class="acct-info-row"><span class="acct-info-label">Login ID</span><span class="acct-info-value">[[my_loginid]]</span></div>
  <div class="acct-info-row"><span class="acct-info-label">ID</span><span class="acct-info-value">[[my_userid]]</span></div>
  <div class="acct-info-row"><span class="acct-info-label">Email</span><span class="acct-info-value">[[my_useremail]]</span></div>
  <div class="acct-info-row"><span class="acct-info-label">Phone</span><span class="acct-info-value">[[my_phonenumber]]</span></div>
  <div class="acct-info-row"><span class="acct-info-label">SiteID</span><span class="acct-info-value">[[siteid]]</span></div>
</div>

<details>
  <summary class="acct-pwd-toggle">Change Password</summary>
  <div class="acct-pwd-body">
    <form id="acctPwdForm">
      <div class="mb-3">
        <label for="acctOldPwd" class="form-label">Current Password</label>
        <input type="password" class="form-control" id="acctOldPwd" maxlength="256" autocomplete="current-password" />
      </div>
      <div class="mb-3">
        <label for="acctNewPwd" class="form-label">New Password</label>
        <input type="password" class="form-control" id="acctNewPwd" maxlength="256" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-account">Update Password</button>
      <div id="acctPwdStatus" class="acct-pwd-status"></div>
    </form>
  </div>
</details>

<script>
  document.getElementById('acctPwdForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var oldPwd = document.getElementById('acctOldPwd').value;
    var newPwd = document.getElementById('acctNewPwd').value;
    var statusEl = document.getElementById('acctPwdStatus');

    function showStatus(msg, ok) {
      statusEl.textContent = msg;
      statusEl.className = 'acct-pwd-status ' + (ok ? 'ok' : 'err');
    }

    if (!oldPwd || !newPwd) { showStatus('Please fill in both fields.', false); return; }
    if (newPwd.length < 6) { showStatus('New password must be at least 6 characters.', false); return; }

    try {
      var resp = await fetch('/runcmd', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cmd: 'user/changePassword', oldPassword: oldPwd, newPassword: newPwd })
      });
      var data = await resp.json();
      if (data && data.success) {
        showStatus('Password updated successfully.', true);
        document.getElementById('acctPwdForm').reset();
      } else {
        showStatus((data && data.error) || 'Failed to update password.', false);
      }
    } catch (err) {
      showStatus('Network error. Please try again.', false);
    }
  });
</script>
