<!-- Shared admin chrome (topbar + sidebar/drawer nav). Included via [[subpage:admin-shell]]
     from layout_admin_dashboard.cfg and layout_admin_utility.cfg so both templates share
     one nav block. Site-specific nav items still come through [[menu:admin]] below,
     which already resolves to the site's own templates/menu_admin.cfg if it has one. -->
<header class="topbar">
  <button class="hamburger" data-drawer-open aria-label="Open menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="brand">
    <span class="logo-chip" data-logo-initials></span>
    <span class="site-name">[[siteParameter:siteTitle]]</span>
  </div>
  <span class="status-pill">
    <span class="status-dot"></span>
    [[siteId]]
  </span>
  <span class="spacer"></span>
  <button class="icon-btn" data-theme-toggle aria-label="Toggle light / dark mode">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
  </button>
  <span class="user-chip">[[my_username]]</span>
  <a class="icon-btn" href="login?logout=true" aria-label="Sign out" title="Sign out">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  </a>
</header>

<aside class="sidebar">
  <nav class="nav">
    <a class="nav-item" href="admin">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a>
    [[menu:admin]]
  </nav>
  <div class="nav-footer">
    <span>[[my_username]]</span>
    <a href="login?logout=true">Sign out</a>
  </div>
</aside>

<div class="drawer-backdrop" data-drawer-close></div>
