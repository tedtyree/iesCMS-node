<!-- Default (no site override): shown inside admin.cfg's "Admin Extras" .tile-grid.
     A site adds its own websites/<siteId>/pages/admin-extras.cfg to replace this with
     real .tile.extra-tile links — the .tile-icon can be left as this same generic
     "sparkle" icon so site builders don't have to pick one per item. -->
<div class="tile extra-tile" style="opacity:.7;">
  <span class="tile-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4z"/></svg></span>
  <span><p class="tile-title">No extras configured</p><p class="tile-desc">Add websites/&lt;siteId&gt;/pages/admin-extras.cfg to list site-specific admin links here.</p></span>
</div>
