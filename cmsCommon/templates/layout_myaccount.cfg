<HTML>
<HEAD>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="/cmsCommon/src/admin.css" rel="stylesheet" type="text/css">
<link rel="stylesheet" href="/cmsCommon/bootstrap/bootstrap.css">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Open Sans', Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
  }
  .ies-account-wrapper {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .ies-account-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    padding: 40px 36px 32px;
    width: 100%;
    max-width: 420px;
    box-sizing: border-box;
  }
  .ies-account-card h2 {
    text-align: center;
    font-family: 'Open Sans', Arial, sans-serif;
    font-weight: 700;
    color: #2c384e;
    margin: 0 0 22px 0;
    font-size: 24px;
  }
  .ies-account-card .form-label {
    font-size: 13px;
    font-weight: 600;
    color: #8086a9;
    margin-bottom: 4px;
  }
  .ies-account-card .form-control {
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #d6d8e6;
    border-radius: 6px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .ies-account-card .form-control:focus {
    border-color: #4154f1;
    box-shadow: 0 0 0 3px rgba(65,84,241,0.12);
  }
  .ies-account-card .btn-account {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    background: #4154f1;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .ies-account-card .btn-account:hover {
    background: #3040d0;
  }
  .ies-account-footer {
    margin-top: 32px;
    text-align: center;
    color: #aab0c6;
    font-size: 12px;
  }
  .ies-account-footer a {
    color: #8086a9;
    text-decoration: none;
  }
  .ies-account-footer a:hover {
    text-decoration: underline;
  }
  @media (max-width: 480px) {
    .ies-account-card { padding: 28px 20px 24px; }
  }
</style>
</HEAD>
<BODY>

<div class="ies-account-wrapper">
  <div class="ies-account-card">
    <h2>[[page_title]]</h2>
    [[content_area]]
  </div>

  <div class="ies-account-footer">
    powered by <a href="http://eBiasharaRahisi.com" target="_blank">eBiasharaRahisi.com</a>
  </div>
</div>

</BODY>
</HTML>
