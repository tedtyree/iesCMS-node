<SCRIPT type="text/javascript">
var world="[[world]]";
var userObjID="[[userObjID]]";
var sid="[[sessionID]]";
function gotopage(sURL) {
  var opentype="";
  if (arguments.length>1) { if (arguments[1]==true) {opentype="w";}}
  if (opentype=="w") { window.open(sURL); }
  else {  window.location=sURL;  }
}
</SCRIPT>
</HEAD>
<BODY class="[[pageid]]">
<script>
(function(){
  try {
    var t = localStorage.getItem('iescms_admin_theme');
    if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-boot-theme', t); }
  } catch(e){}
})();
</script>
<div id="app-shell" class="shell" data-theme="dark">
  [[subpage:admin-shell]]
  <main class="main">
    <div class="main-inner">
      <div class="breadcrumb"><a href="admin">Admin</a></div>
      <div class="card card-pad">
        [[content_area]]
      </div>
    </div>
  </main>
</div>
[[admin_block]]
[[debug_message]]
<script>
(function(){
  var shell = document.getElementById('app-shell');
  try {
    var t = document.documentElement.getAttribute('data-boot-theme');
    if (t) { shell.setAttribute('data-theme', t); }
  } catch(e){}
})();
</script>
<script src="/cmsCommon/src/admin2.js?[[v]]"></script>
</BODY>
