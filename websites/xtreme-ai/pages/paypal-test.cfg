[[{ minviewlevel:0, template: inner, head_title: Paypal-test,}]]
<h1>paypal test</h1>
<h4>LIVE PAYPAL BUTTON: $7 Item</h4>
<div id="paypal-button-btn7"></div>

<h4>LIVE PAYPAL BUTTON: $50 Item</h4>
<div id="paypal-button-btn50"></div>

<h4>LIVE PAYPAL BUTTON: $150 Item</h4>
<div id="paypal-button-btn150"></div>

<script>
  var url = "https://www.paypal.com/sdk/js?client-id=AfzszPv720-7DC6haxWuXtDgDfy4Die8AezNs5KwAQWYpTTKWBsOf8fD7HRbDeEaIibep7AkK7aJYNGs&currency=USD";
  var myScript = document.createElement('script');
  myScript.setAttribute('data-sdk-integration-source', 'button-factory');
  myScript.src=url;
  document.head.appendChild(myScript);
  
  function MakePaypalButton(buttonName,itemCost){
    paypal.Buttons({
        style: {
            shape: 'rect',
            color: 'black',
            layout: 'vertical',
            label: 'paypal',

        },
        createOrder: function(data, actions) {
            return actions.order.create({
                purchase_units: [{
                    amount: {
                        value: itemCost
                    }
                }]
            });
        },
        onApprove: function(data, actions) {
            return actions.order.capture().then(function(details) {
                alert('Transaction completed by ' + details.payer.name.given_name + '.');
            });
        }
    }).render(buttonName);
  };
  
  myScript.onload = function () {
      MakePaypalButton('#paypal-button-btn7','7');
      MakePaypalButton('#paypal-button-btn50','50');
      MakePaypalButton('#paypal-button-btn150','150');
  };
</script>


