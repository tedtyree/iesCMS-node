[[{ minviewlevel:0, template: inner, head_title: Members Login }]]

	<!-- Page Title
	============================================= -->
	<section id="page-title" class="page-title-mini">
		<div class="container clearfix">
			<h1>Members Login</h1>
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a href="#">Home</a></li>
				<li class="breadcrumb-item">Members</li>
              

			</ol>
		</div>
	</section>


	<!-- Content
	============================================= -->
	<section id="content">
		<div class="content-wrap">

		<form class="emailplain-and-simple-login-form">
  <h2 class="emailplain-and-simple-login-title">Login</h2>
  <div class="emailplain-and-simple-login-input">
    <label class="emailplain-and-simple-login-label" for="emailplain-and-simple-username">Username:</label>
    <input class="emailplain-and-simple-login-textbox" type="text" id="emailplain-and-simple-username" name="username">
  </div>
  <div class="emailplain-and-simple-login-input">
    <label class="emailplain-and-simple-login-label" for="emailplain-and-simple-password">Password:</label>
    <input class="emailplain-and-simple-login-textbox" type="password" id="emailplain-and-simple-password" name="password">
  </div>
  <div class="emailplain-and-simple-login-forgot-password">
    <a class="emailplain-and-simple-login-link" href="#">Forgot Password?</a>
  </div>
  <button class="emailplain-and-simple-login-button" type="submit">Login</button>
</form>


</div>

	</div>
	</section><!-- #content end -->
	