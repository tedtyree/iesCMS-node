[[{ minviewlevel:0, template: cart, head_title: Sign Up }]]

	
		<!-- Page Title
	============================================= 
	<section id="page-title" class="page-title-mini">
		<div class="container clearfix">-->
			<div class="email-plain-simple-breadcrumbs-wrapper">
				<div class="email-plain-simple-breadcrumbs-left-div">
					<h1>Checkout</h1>
				</div>
				<div class="email-plain-simple-breadcrumbs-right-div">
					<ol class="breadcrumb">
						<li class="breadcrumb-item"><a href="#">Home</a></li>
						<li class="breadcrumb-item active" aria-current="page">Checkout</li>
					</ol>
				</div>

			</div>
		<!--</div>
	</section> #page-title end -->

	<!-- Content
	============================================= -->
	<section id="content ">
		<div class="content-wrap">
			<div class="container clearfix checkout-page-layout-wrap">
				<!-- Postcontent
				============================================= -->
				<div class="postcontent nobottommargin">
					<h3>Customer information </h3>
					<div class="not-form-widget">
						<div class="form-result"></div>
						<form class="nobottommargin" id="template-contactform" name="template-contactform">
							<!--   <div class="form-process"></div>-->
							
							<div id="email-plain-simple-signup-options">
							    <div class="row">
								  <h3>Small Emails</h3>
								  <div class="quantity" data-index="emails">
									<input type="text" value="0">
									<button class="minus-btn">-</button>
									<button class="plus-btn">+</button>
									<button class="remove">Remove</button>
								  </div>
								</div>
								
								<div class="row">
								  <h3>Large Emails</h3>
								  <div class="quantity" data-index="largeemails">
									<input type="text" value="0">
									<button class="minus-btn">-</button>
									<button class="plus-btn">+</button>
									<button class="remove">Remove</button>
								  </div>
								</div>


								<div class="row">
								  <h3>Email Forwards</h3>
								  <div class="quantity" data-index="forwards">
									<input type="text" value="0">
									<button class="minus-btn">-</button>
									<button class="plus-btn">+</button>
									<button class="remove">Remove</button>
								  </div>
								</div>

								<div class="row">
								  <h3>Consultation Hours</h3>
								  <div class="quantity" data-index="consultation">
									<input type="text" value="0">
									<button class="minus-btn">-</button>
									<button class="plus-btn">+</button>
									<button class="remove">Remove</button>
								  </div>
								</div>
							</div>
							
							<div class="col_one_third">
								<label for="template-contactform-name">Name <small>*</small></label>
								<input type="text" id="template-contactform-name" name="template-contactform-name"
									value="" class="sm-form-control required" />
							</div>
							<div class="col_one_third">
								<label for="template-contactform-email">Email <small>*</small></label>
								<input type="email" id="template-contactform-email" name="template-contactform-email"
									value="" class="required email sm-form-control" />
							</div>
							<div class="col_one_third col_last">
								<label for="template-contactform-phone">Phone</label>
								<input type="text" id="template-contactform-phone" name="template-contactform-phone"
									value="" class="sm-form-control" />
							</div>
							
							<div class="clear"></div>
							<div class="col_one_third">
								<label for="template-contactform-subject">Company (optional)</label>
								<input type="text" id="template-contactform-subject" name="subject"
									value="" class="sm-form-control" />
							</div>
							<div class="col_one_third">
								<label for="template-contactform-subject">Domain Name</label>
								<input type="text" id="template-contactform-domain" name="domain"
									value="" class="sm-form-control" />
							</div>
							<div class="col_full">
								<p style="margin-top:25px"><i>If you need help selecting a domain name for your email services, we are here to serve you.</i></p>
							</div>
							<div class="col_two_third">
								<label for="template-contactform-subject">Please indicate below your services required.</label>
							</div>
							<div class="clear"></div>
							<div class="col_full">
								<label for="template-contactform-message">Additional Comments</label>
								<textarea class="required sm-form-control" id="template-contactform-message"
									name="template-contactform-message" rows="6" cols="30"></textarea>
							</div>
							<div class="col_full hidden">
								<input type="text" id="template-contactform-botcheck"
									name="template-contactform-botcheck" value="" class="sm-form-control" />
							</div>
							<div class="col_full">
								<p><i>Note: Once required details have been clarified, we will send you an invoice and work with you to intiate services quickly.</i></p>
							</div>
						
							<div class="col_full">
							    
								<input class="button button-3d nomargin" type="submit" id="template-contactform-submit"
									name="template-contactform-submit" value="Sign Up" />
							</div>
							<input name="form_id" type="hidden" value="Contact Us" />
							<input name="form_w" type="hidden" value="[[world]]" />
							<input name="invoice_number" type="hidden" value="" />
						</form>
					</div>
				</div><!-- .postcontent end -->
				<!-- Sidebar
				============================================= -->
				<div class="sidebar col_last nobottommargin">
				    <div class="checkout-sidebar">
                      
					   <div class="cart-contents-checkout">
						  <table class="checkout-table">
							<thead>
							  <tr>
								<th>Your Order</th>
								<th>Subtotal</th>
							  </tr>
							</thead>
							<tbody>
							  <tr>
								<td>Branded Emails</td>
								<td id="branded-emails-td-amount"></td>
							  </tr>
							<tr>
								<td>Large Emails</td>
								<td id="large-emails-td-amount"></td>
							  </tr>
							  <tr>
								<td>Emails Forwards</td>
								<td id="emails-forwards-td-amount"></td>
							  </tr>
							  <tr>
								<td>Consultation</td>
								<td id="consult-hours-td-amount"></td>
							  </tr>
							</tbody>
						  </table>
						</div>
           
					<div class="checkout-total-price">
					  <div class="checkout-total-price-label">Total Price : </div>
					  <div id="total_price_amount"></div>
					  
					</div>
					 
					<hr> 
					<br>
					<div class="checkout-total-price-button-container">
					
						<div id="paypal-button-container"></div>
					  </div>
					</div>
				</div><!-- .sidebar end -->
			</div>
		</div>
	</section><!-- #content end -->
	
	
