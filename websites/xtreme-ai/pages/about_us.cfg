  <h2 style="color: #fff">A note from our founder</h2>
  <p><b>Why another networking company? Why another AI consulting firm?</b>
Well... I'm glad you asked. How many times have we mused about how so many others just haven't gotten it right? 
We complain that AI shouldn’t be replacing people and human interactions, but should be enhancing them. 
We all talked the talk, but it seemed to me it was time to walk the walk. So we did. 
A small team of us decided it was time—and that small team is quickly becoming a big team. 
Maybe it’s not yet a movement or a renegade force, but it’s something. 
And it’s worth making a difference for the people on the receiving end. Let’s do this thing!</p>
  <p> - Ted Tyree</p>
