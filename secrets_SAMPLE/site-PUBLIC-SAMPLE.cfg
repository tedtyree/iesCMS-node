// site.cfg — SAMPLE
// This is an example site.cfg, based on websites/delta_align/site.cfg. Copy this file to
// websites/<yourSiteId>/site.cfg and fill in the real values for your site.
//
// This file is FlexJSON (see https://www.npmjs.com/package/flex-json) — comments work just
// like JavaScript (// line comments, /* block comments */), even though the file is really
// a JSON object under the hood. Values can reference other tags with [[tagName]] (see
// iesCMS-node PRD.md #REQ-CONFIG-01-04).
{
    Domains: ["yoursite.example.com"]
    ,DefaultPageID: "home"
    ,SiteTitle: "Your Site Title"
    ,SiteID: "yourSiteId"

    // Database — presence of this key triggers auto-creation of tables at startup.
    // Omit entirely if this site doesn't need a database.
    ,databasename: "yourSiteId"

    /* ==================== Google Sign-In (OPTIONAL) ====================
    ** Only needed if this site supports "Sign in with Google" — either the browser-based
    ** login flow (SessionLoginGoogle() in require/iesCommon.js) or a mobile app's Google
    ** SSO endpoint (see websites/delta_align/cmd/align/auth-google_pub.js for an example).
    ** Omit all three keys entirely if this site doesn't use Google Sign-In.
    **
    ** GOOGLE_CLIENT_ID is the WEB OAuth 2.0 client ID from Google Cloud Console
    ** (APIs & Services -> Credentials). Setting it here overrides the server-wide default
    ** of the same name in secrets/server.cfg — only needed if this site uses a different
    ** Google Cloud project/client than the server default. A mobile app using native
    ** sign-in (@react-native-google-signin/google-signin, the current recommended approach
    ** — see delta_align's mobile app) configures itself with THIS web client ID, so this is
    ** normally the `aud` claim on tokens from Android AND iOS, not the platform-specific IDs.
    **
    ** GOOGLE_ANDROID_CLIENT_ID / GOOGLE_IOS_CLIENT_ID are the ANDROID/iOS OAuth 2.0 client
    ** IDs, tied to a specific Android package name + SHA-1 signing certificate fingerprint,
    ** or iOS bundle ID, respectively. There is deliberately no server-wide default for
    ** either: each mobile app has its own package/bundle id and signing key, so they only
    ** ever make sense per-site. They mainly let Play Services/Apple vouch for the calling
    ** app; the server accepts them as valid audiences defensively in case a token ever
    ** does carry one of them instead of the web client ID.
    **
    ** None of these are secrets (no client_secret is used in this ID-token verification
    ** flow) — safe to commit real values here, same as REPORTING_API_KEY/MAR_UPLOAD_API_KEY
    ** below. See docs/MED-Security.md and iesCMS-node PRD.md #REQ-MOBILE-AUTH-01-05.
    */
    // ,GOOGLE_CLIENT_ID: "123456789-abc...apps.googleusercontent.com"
    // ,GOOGLE_ANDROID_CLIENT_ID: "123456789-xyz...apps.googleusercontent.com"
    // ,GOOGLE_IOS_CLIENT_ID: "123456789-def...apps.googleusercontent.com"

    /* Example of a site-specific API key for inbound calls from an external system.
    ** IMPORTANT: Change this value before deploying to production!
    */
    //,SOME_API_KEY: "APIKEY-00000000-0000-0000-0000-000000000000"

    // Auth / routing
    ,LOGIN_PAGE: "login"
    ,MEMBER_DEFAULT_PAGE: "home"
    ,OverrideMinViewLevel: 0
    ,DEFAULT_TEMPLATE: "main"
    ,ERROR_TEMPLATE: "main"
    ,INVALID_PAGE: "page_not_found"

    // Domain forwarding — 3 = allow any domain (dev mode); tighten for production
    ,URLForwardHost: 3

    // Debug — set to 0 in production
    ,debugMode: 0

    // Folder paths — these follow the standard convention and rarely need changing
    ,baseFolder: "[[SERVER_FOLDER]]/websites/[[SiteID]]"
    ,PageFolder: "[[baseFolder]]/pages"
    ,TemplateFolder: "[[baseFolder]]/templates"
    ,genFolder: "[[baseFolder]]/content"
    ,genURL: "/[[SiteID]]/content"
    ,ROOT_URL: "/[[SiteID]]"
    ,URLS: "[[SERVER_URLS]]/[[SiteID]]"
    ,LOGIN_URL: "[[URLS]]/[[LOGIN_PAGE]]"
}
