// SERVER CONFIG: s41
// **************************************************************************************
// **************************************************************************************
// **************************************************************************************
{
    ServerID:"s41" 
    ,hostDomain:"<<host here>>"
    ,hostIP:"<<ip here>>"
    ,serverPort: 8118

    // DB Connection Info: PostgreSQL only
    // Note! databasename specified in site.cfg per website
    ,DbConnect: { host: "localhost", port: 5432, user: "<<user here>>", password: "<<password here>>" }

	,safuControlPanel:"s1admin.wplot.net"  // URL for the safu Control Panel for this server
    ,truffleId:"[[serverid]]this_is_the_truffle_id"

	,LogFolder:"logs"
	,debugMode: 0
    
    ,SpamFolderCommon:"[[WebRootPath]]\\cmsCommon\\spam"
	,ies_Sessions: true
	,forwardedHost: false

    ,ServerFolder: "."
    ,SERVER_FOLDER: "[[ServerFolder]]"  // for backwards compatibility
    ,CommonTemplateFolder: "[[ServerFolder]]/cmsCommon/templates"
    ,CommonSourceFolder: "[[ServerFolder]]/cmsCommon/src"
    ,CommonPageFolder: "[[ServerFolder]]/cmsCommon/pages"
    ,CommonConfigFolder: "[[ServerFolder]]/cmsCommon/config"
    
    ,JWT_SECRET: "somethingsupersecret"
    ,JWT_EXPIRES_IN: 604800 // 60 * 60 * 24 * 7 SECONDS

    ,GOOGLE_CLIENT_ID: ""          // Web OAuth 2.0 client ID (Google Cloud Console → APIs & Services → Credentials)
    ,GOOGLE_ANDROID_CLIENT_ID: "" // Android OAuth 2.0 client ID — package: com.deltaalign.marreminder, requires SHA-1 fingerprint

    // ========= Outgoing Email Config
    ,email_login: "<<login here>>"   // **** Blank=Login ID not required
    ,email_pwd: "<<password here>>"     // **** Blank=Login PWD not required
    ,email_usecredentials: true
    ,email_ishtml: true
    ,email_smtp_server: "<<server here>>"
    ,email_smtp_port: 587    // *** Set to -1 to disable
    ,email_smtp_ssl: true

}